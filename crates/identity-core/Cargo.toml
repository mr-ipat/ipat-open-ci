[package]
name = "identity-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde = { version = "1", features = ["derive"] }
libc = "=0.2.189"
sha2 = "=0.11.0"
base64 = "=0.22.1"
getrandom = "=0.3.4"
subtle = "=2.6.1"

[dev-dependencies]
tempfile = "=3.23.0"
serde_json = "1"
