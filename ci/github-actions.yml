          python3 -m unittest discover deploy/db/tests -p 'test_identity_memberships_integration.py' -v
      - name: R7.7 restricted nonlogin identity-reader SQL negative tests (disposable DB only)
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_scoped_identity_lookup_integration.py' -v
      - name: R8.0 restricted live disposable PostgreSQL tenant POP inventory SQL policy tests
