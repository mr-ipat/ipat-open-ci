# Separate disposable CI runner and PostgreSQL server process.
  # This rehearses a physical base backup; it is NOT production PITR/offsite HA.
  postgres-physical-recovery-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_DB: ipat_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipat_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      IPAT_PG_EPHEMERAL_TEST: "1"
      IPAT_PG_SYNTHETIC_PASSWORD: local_ci_synthetic_only
      PGHOST: 127.0.0.1
      PGPORT: "5432"

      PGDATABASE: ipat_synthetic
      PGUSER: postgres
      PGPASSWORD: local_ci_synthetic_only
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated PostgreSQL 16 runner binaries without an auto-created cluster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y postgresql-16
          /usr/lib/postgresql/16/bin/pg_ctl --version
      - name: Seed original synthetic RLS and job/outbox fixtures
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_postgres_rls_integration.py' -v
          python3 -m unittest discover deploy/db/tests -p 'test_job_outbox_integration.py' -v
      - name: Verify synthetic physical basebackup and restore on separate CI server process
        run: bash deploy/db/tests/physical_restore_ephemeral.sh

# Real single-node K3s runs ONLY on a freshly provisioned, disposable
  # GitHub-hosted Ubuntu 26.04 VM. It NEVER installs on the IPAT VPS.
  k3s-ubuntu26-disposable:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      IPAT_K3S_DISPOSABLE_LAB: "1"
      IPAT_R58_SMOKE: "1"
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare disposable Rust/musl, checksum-pinned Helm and local-only manifest tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools python3-yaml
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.98.1
          helm_temp="$(mktemp -d /tmp/ipat-r58-helm.XXXXXXXX)"
          trap 'rm -rf "$helm_temp"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz \
            -o "$helm_temp/helm.tar.gz"
          printf '%s  %s\n' \
            15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0 \
            "$helm_temp/helm.tar.gz" | sha256sum --check --status
          tar -xz -C "$helm_temp" -f "$helm_temp/helm.tar.gz" linux-amd64/helm
          sudo install -m 0755 "$helm_temp/linux-amd64/helm" /usr/local/bin/helm
          helm lint deploy/helm/ipat-lab
          python3 -m unittest discover deploy/scripts/lab/r58 -p test_r58_manifest.py -v
      - name: Verify pinned K3s CI safety before any root action
        run: |
          bash -n deploy/scripts/lab/k3s-ubuntu26-ephemeral-ci.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_k3s_ubuntu26_ephemeral_review.py' -v
      - name: R7.9 check heterogeneous provider-neutral private WireGuard network PLAN on real disposable Ubuntu26
        run: |
          python3 -m unittest discover deploy/scripts/lab/r79 -p test_k3s_provider_neutral.py -v
          python3 deploy/scripts/lab/r79/k3s-provider-neutral-plan.py --example | python3 -m json.tool >/dev/null
      - name: Install and smoke-test checksum-pinned K3s on disposable Ubuntu 26.04
        run: |
